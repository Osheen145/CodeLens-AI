services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GOOGLE_GEMINI_KEY=${GOOGLE_GEMINI_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
